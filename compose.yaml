services:
  pearl:
    platform: linux/amd64
    image: ghcr.io/tourshein/pearl-srb-docker:bootstrap-3.8.1
    pull_policy: always
    init: true
    restart: "no"
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    stop_grace_period: 30s
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=512m,mode=1777
      - /run/pearl:rw,nosuid,nodev,exec,size=256m,mode=0700,uid=10001,gid=10001
    environment:
      PRL_WALLET: ${PRL_WALLET:?Set public Pearl address}
      WORKER: ${WORKER:-pearl01}
      POOL_HOST: ${POOL_HOST:-prl.kryptex.network}
      POOL_PORT: ${POOL_PORT:-8048}
      GPU_UUID: ${GPU_UUID:?Set one full GPU UUID}
      NVIDIA_VISIBLE_DEVICES: ${GPU_UUID:?Set one full GPU UUID}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_UUID:?Set one full GPU UUID}"]
              capabilities: [gpu]
    # First start downloads, verifies and executes upstream closed-source mining software.
    # Dedicated cache only: never mount NAS shares, Docker socket or host root.
    volumes:
      - miner-cache:/var/cache/pearl
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  miner-cache:

